    expire_in: 1 week
    reports:
      junit: build/unittests.xml 

.package:
  stage: package
  tags: ["docker", "linux"]
  extends: [".run-master-and-tags"]
  image: debian:bullseye
  script:
    - cp -r install-$toolchain-dbg/* install-$toolchain
    - mv install-$toolchain gtlab-intelligraph-$toolchain
    - tar czf gtlab-intelligraph-$toolchain.tar.gz gtlab-intelligraph-$toolchain
  artifacts:
    name: "gtlab-intelligraph-$toolchain"
    paths: ["gtlab-intelligraph-$toolchain.tar.gz"]
  variables:
    toolchain: msvc2019
    GIT_STRATEGY: "none"

package-win-gtlab_2.0:
  extends: [".package"]
  needs: ["windowsBuildDebug", "windowsBuildRelease"]
  variables:
    toolchain: msvc2019

package-win-gtlab_2.1:
  extends: [".package"]
  needs: ["windowsBuildDebug_2.1", "windowsBuildRelease_2.1"]
  variables:
    toolchain: msvc2026

package-linux-gtlab_2.0:
  extends: [".package"]
  needs: ["linuxBuildDebug", "linuxBuildRelease"]
  variables:
    toolchain: linux

package-linux-gtlab_2.1:
  extends: [".package"]
  needs: ["linuxBuildDebug_2.1", "linuxBuildRelease_2.1"]
  variables:
    toolchain: linux

