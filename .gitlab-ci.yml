testWin_2.0:
  stage: test
  extends:
    - .windocker_2.0
  needs: ["windowsBuildDebug"]
  before_script:
    - !reference [.update_devtools_win, script]
  script:
    - $env:path = "$env:GTLAB_DEV_TOOLS\binDebug;$env:GTLAB_DEV_TOOLS\binDebug\modules;$env:path"
    - cd build
    - .\IntelliGraphUnitTests.exe --gtest_output=xml:unittests.xml
  artifacts:
    paths:
      - "build/unittests.xml"
    expire_in: 1 week
    reports:
      junit: build/unittests.xml

testWin_2.1:
  stage: test
  extends:
    - .windocker_2.1
  needs: ["windowsBuildDebug_2.1"]
  before_script:
    - !reference [.update_devtools_win, script]
  script:
    - $env:path = "$env:CI_PROJECT_DIR\build\modules;$env:GTLAB_DEV_TOOLS\binDebug;$env:GTLAB_DEV_TOOLS\binDebug\modules\;$env:QT_INSTALL_PATH\bin;$env:path"
    - cd build
    - .\IntelliGraphUnitTests.exe --gtest_output=xml:unittests.xml
  artifacts:
    paths:
      - "build/unittests.xml"
    expire_in: 1 week
    reports:
      junit: build/unittests.xml

testLinux_2.0:
  stage: test
  extends:
    - .linuxdocker_2.0
  needs: ["linuxBuildDebug"]
  before_script:
    # update to latest dev tools
    - !reference [.update_devtools_linux, script]
  script:
    - cd build
    - LD_LIBRARY_PATH="$GTLAB_DEV_TOOLS/binDebug" ./IntelliGraphUnitTests --gtest_output=xml:unittests.xml
  variables:
    GIT_SUBMODULE_STRATEGY: "none"
  artifacts:
    paths:
      - "build/unittests.xml"
    expire_in: 1 week
    reports:
      junit: build/unittests.xml 

testLinux_2.1:
