    - cmake -B build -S . -G "Ninja" -DGTlabDevtools_ROOT="$env:GTLAB_DEV_TOOLS"  -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install-msvc2019
